name: Sep27 R2 Render Fallback
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-r2-render-fallback.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build corrected five-slide plan
        shell: bash
        run: |
          cat > sep27-r2-plan.json <<'JSON'
          {
            "caption":"Claude Opus 5 與 Qwen3-Max 都是閉源旗艦，但強項路線不同。Claude 更聚焦長上下文、複雜編碼與多步驟 agent 工作流；Qwen3-Max 則整合思考模式、Web 搜尋、資訊提取與 Code Interpreter。真正的選型關鍵，不只是 benchmark 高低，而是你的任務更需要長文件與代理執行，還是完整工具鏈與成本彈性。這組輪播整理兩者在上下文、工具能力與實際應用上的差異，完整分析可到 PLAY AI 筆記閱讀。",
            "hashtags":["#ClaudeOpus5","#Qwen3Max","#AI模型比較","#代理能力","#上下文窗口"],
            "slides":[
              {
                "index":1,"role":"cover","topicTag":"模型選型比較",
                "headline":"Claude Opus 5 vs Qwen3-Max","highlight":"Qwen3-Max",
                "subheadline":"長上下文、代理工作流與工具整合，兩條路線差在哪？",
                "bullets":[
                  "Claude 以 1M 上下文支援長文件與多步驟 agent 任務。",
                  "Qwen3-Max 整合思考、Web 搜尋與 Code Interpreter。",
                  "選型關鍵在長任務代理能力，還是完整工具鏈整合。"
                ],
                "takeaway":"差異不只 benchmark，而是整條工作流的適配。","cta":""
              },
              {
                "index":2,"role":"context","topicTag":"上下文與成本",
                "headline":"Qwen3-Max 支援 256K 輸入","highlight":"256K",
                "subheadline":"長文件能力之外，分層計價也直接影響大規模推理成本。",
                "bullets":[
                  "最高支援 256K 輸入 token，並按長度分級計價。",
                  "0–32K 區間輸入 1.2 美元/百萬 token，輸出 6 美元。",
                  "32K–128K 區間輸入 2.4 美元，輸出 12 美元。"
                ],
                "takeaway":"上下文夠不夠之外，長 prompt 的成本曲線也要一起看。","cta":""
              },
              {
                "index":3,"role":"key-points","topicTag":"核心能力差異",
                "headline":"Claude 更偏長任務 agent 工作流","highlight":"agent 工作流",
                "subheadline":"長上下文、GUI 互動與複雜編碼，是 Claude 路線的核心。",
                "bullets":[
                  "支援 Computer Use，可操作 GUI、網頁與桌面應用。",
                  "Artifacts 可即時呈現程式碼與文件成果。",
                  "Qwen3-Max 思考模式支援 Web 搜尋與 Code Interpreter。"
                ],
                "takeaway":"Claude 偏代理執行，Qwen 更偏工具整合。","cta":""
              },
              {
                "index":4,"role":"application","topicTag":"實際選型",
                "headline":"真正要比的是整條工作流","highlight":"整條工作流",
                "subheadline":"任務長度、工具依賴與成本結構，比單一 benchmark 更接近實際使用。",
                "bullets":[
                  "長文件與多步驟代理，更重視上下文與持續執行能力。",
                  "搜尋、程式執行與資料處理，更看工具鏈整合程度。",
                  "大量長 prompt 工作負載，還要把分層計價納入評估。"
                ],
                "takeaway":"先定義工作流，再比較模型能力與成本。","cta":""
              },
              {
                "index":5,"role":"summary-cta","topicTag":"模型選型觀察",
                "headline":"沒有單一贏家，只有任務適配","highlight":"任務適配",
                "subheadline":"把上下文、代理能力、工具整合與成本放在同一張表再決定。",
                "bullets":[
                  "觀察推理深度、工具成功率與長任務成本。",
                  "持續追蹤官方基準更新與第三方評測。"
                ],
                "takeaway":"","cta":"到 PLAY AI 筆記閱讀完整比較與來源"
              }
            ]
          }
          JSON
          jq . sep27-r2-plan.json

      - name: Render branded JPEGs with production fallback background
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "CHROME=$chrome"
          mkdir -p sep27-rendered
          python3 - <<'PY'
          import json, html, pathlib
          plan=json.load(open('sep27-r2-plan.json'))
          bg='https://play-ai.cc/api/ig/media/image/1790515060643-f910c2bb-3895-48a0-a501-207c04a0c6e5.jpg'
          logo='https://play-ai.cc/logo.svg'
          for s in plan['slides']:
              role=s['role']; idx=s['index']
              h=html.escape(s['headline']); hi=html.escape(s.get('highlight',''))
              if hi and hi in h:
                  h=h.replace(hi, f'<span>{hi}</span>', 1)
              bullets=''.join(f'<div class="bullet"><b>{i:02d}</b><div>{html.escape(x)}</div></div>' for i,x in enumerate(s.get('bullets',[])[:4],1))
              takeaway=html.escape(s.get('takeaway',''))
              cta=html.escape(s.get('cta',''))
              doc=f'''<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
              *{{box-sizing:border-box}}html,body{{margin:0;width:1080px;height:1350px;overflow:hidden;background:#111114;font-family:"Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:#fff}}
              .slide{{position:relative;width:1080px;height:1350px;overflow:hidden;background:#111114}}
              .art{{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}}.shade{{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,20,.40),rgba(17,17,20,.18) 28%,rgba(17,17,20,.70) 72%,rgba(17,17,20,.97)),linear-gradient(90deg,rgba(17,17,20,.96),rgba(17,17,20,.72) 56%,rgba(17,17,20,.25))}}
              .grid{{position:absolute;inset:0;opacity:.10;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:64px 64px}}
              .header{{position:absolute;left:72px;right:72px;top:52px;height:84px;display:flex;align-items:center;justify-content:space-between;z-index:8}}.brand{{display:flex;align-items:center;gap:18px}}.brand img{{width:66px;height:66px}}.brand-name{{font-size:31px;font-weight:850}}.page{{font-size:22px;font-weight:760;letter-spacing:2px;color:rgba(255,255,255,.82)}}.page strong{{color:#E7C15C}}
              .content{{position:absolute;left:72px;right:72px;top:190px;bottom:235px;z-index:5;display:flex;flex-direction:column;align-items:flex-start}}.tag{{padding:11px 18px;border:1px solid rgba(231,193,92,.55);border-radius:999px;background:rgba(17,17,20,.48);color:#E7C15C;font-size:22px;font-weight:780;margin-bottom:24px}}
              h1{{margin:0;max-width:920px;font-size:74px;line-height:1.08;letter-spacing:-1.8px;font-weight:920;text-shadow:0 4px 24px rgba(0,0,0,.42)}}h1 span{{color:#A89CFF}}.cover h1{{font-size:86px;line-height:1.05}}.summary-cta h1{{font-size:78px}}
              .sub{{margin-top:24px;max-width:900px;font-size:40px;line-height:1.38;font-weight:600;color:#E6E6EA}}.accent{{width:130px;height:8px;margin:40px 0 28px;border-radius:999px;background:linear-gradient(90deg,#6C5CFF,#E7C15C)}}
              .bullets{{display:flex;flex-direction:column;gap:16px;width:min(930px,100%)}}.bullet{{display:flex;align-items:flex-start;gap:20px;width:100%}}.bullet b{{flex:0 0 44px;padding-top:6px;color:#E7C15C;font-size:20px}}.bullet div{{font-size:40px;line-height:1.28;font-weight:700;text-shadow:0 3px 18px rgba(0,0,0,.38)}}
              .takeaway{{position:absolute;z-index:7;left:72px;right:72px;bottom:78px;min-height:82px;border-radius:18px;padding:17px 24px;display:flex;align-items:center;background:linear-gradient(90deg,#8F6B16 0%,#B98D27 52%,#E7C15C 100%)}}.takeaway strong{{font-size:40px;line-height:1.22;font-weight:850;color:#111114}}
              .summary-cta .takeaway{{display:none}}.cta{{display:none}}.summary-cta .cta{{display:block;margin-top:20px;max-width:860px;padding-left:20px;border-left:5px solid #6C5CFF;font-size:34px;line-height:1.42;font-weight:760}}.summary-cta .bullets{{display:none}}.summary-cta .content{{bottom:330px}}
              .social{{display:none}}.summary-cta .social{{position:absolute;z-index:8;left:72px;right:72px;bottom:142px;display:flex;flex-direction:column;align-items:center;gap:24px}}.handle{{font-size:34px;font-weight:850}}
              .footer{{position:absolute;right:72px;bottom:38px;z-index:8;color:rgba(255,255,255,.54);font-size:17px;letter-spacing:1px}}.summary-cta .footer{{display:none}}
              </style></head><body><main class="slide {role}">
              <img class="art" src="{bg}"><div class="shade"></div><div class="grid"></div>
              <header class="header"><div class="brand"><img src="{logo}"><div class="brand-name">PLAY AI</div></div><div class="page"><strong>{idx:02d}</strong> / 05</div></header>
              <section class="content"><div class="tag">{html.escape(s['topicTag'])}</div><h1>{h}</h1><div class="sub">{html.escape(s['subheadline'])}</div><div class="accent"></div><div class="bullets">{bullets}</div>{f'<div class="cta">{cta}</div>' if cta else ''}</section>
              {f'<div class="takeaway"><strong>{takeaway}</strong></div>' if takeaway else ''}
              {f'<aside class="social"><div class="handle">@play.ai.tw</div></aside>' if role=="summary-cta" else ''}
              <div class="footer">PLAY-AI.CC</div></main></body></html>'''
              pathlib.Path(f'sep27-rendered/slide-{idx}.html').write_text(doc,encoding='utf-8')
          PY

          for i in 1 2 3 4 5; do
            "$chrome" --headless=new --no-sandbox --disable-gpu               --window-size=1080,1350 --hide-scrollbars               --virtual-time-budget=5000               --screenshot="sep27-rendered/slide-${i}.png"               "file://$PWD/sep27-rendered/slide-${i}.html"
            test -s "sep27-rendered/slide-${i}.png"
          done

      - name: Stage five images to PLAY AI R2
        shell: bash
        run: |
          set -euo pipefail
          echo '[]' > sep27-r2-results.json
          for i in 1 2 3 4 5; do
            data="data:image/png;base64,$(base64 -w0 "sep27-rendered/slide-${i}.png")"
            jq -cn --arg sourceUrl "$data" '{sourceUrl:$sourceUrl,mediaType:"image"}' > /tmp/body.json
            code="$(curl --silent --show-error --max-time 90               --output "/tmp/stage-${i}.json" --write-out '%{http_code}'               --request POST 'https://play-ai.cc/api/ig/stage-media'               --header 'Content-Type: application/json'               --header 'Origin: https://play-ai.cc'               --header 'Sec-Fetch-Site: same-origin'               --data-binary @/tmp/body.json || true)"
            echo "slide=$i stage_http=$code"
            cat "/tmp/stage-${i}.json"
            test "$code" = "200"
            jq -e '.success == true and .url' "/tmp/stage-${i}.json" >/dev/null
            jq --argjson row "$(jq -c --argjson index "$i" '{index:$index,url:.url,key:.key}' "/tmp/stage-${i}.json")" '. + [$row]' sep27-r2-results.json > /tmp/results.json
            mv /tmp/results.json sep27-r2-results.json
          done
          cat sep27-r2-results.json

      - name: Verify public URLs
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[].url' sep27-r2-results.json | while IFS= read -r u; do
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$u")"
            echo "$code $u"
            test "$code" = "200"
          done

      - name: Persist fallback evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --soft origin/master
          git add sep27-r2-plan.json sep27-r2-results.json sep27-rendered/*.png 2>/dev/null || true
          git commit -m "ops: capture Sep27 corrected R2 carousel fallback" || true
          git push
