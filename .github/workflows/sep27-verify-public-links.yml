name: Sep27 Verify Public Links
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-verify-public-links.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify five public image URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://play-ai.cc/api/ig/media/image/1790558809328-7abb52a5-8daf-43cc-ba41-bdb63fd07427.jpg"
            "https://play-ai.cc/api/ig/media/image/1790558839772-6410b1bc-999d-4d47-92cb-3f3a0b4c1edb.jpg"
            "https://play-ai.cc/api/ig/media/image/1790558868010-ca7a3cde-4560-4382-9d7f-37cc0996f681.jpg"
            "https://play-ai.cc/api/ig/media/image/1790558896344-73a9c7d0-d041-4cda-afd9-4f40e3072374.jpg"
            "https://play-ai.cc/api/ig/media/image/1790558927859-54f928bc-407c-4db4-8396-88610d62feb6.jpg"
          )
          for u in "${urls[@]}"; do
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$u")"
            echo "$code $u"
            test "$code" = "200"
          done
