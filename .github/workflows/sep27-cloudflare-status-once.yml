name: Sep27 Cloudflare Status Once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-cloudflare-status-once.yml"

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read status once
        shell: bash
        run: |
          set -euo pipefail
          url="https://playai-voicechat-watchdog.itissam.workers.dev/__ops/sep27-ig-direct-export-status-27c4f1"
          curl --fail-with-body --silent --show-error --max-time 30 "$url" -o sep27-status-now.json
          jq '.' sep27-status-now.json
          curl --fail-with-body --silent --show-error --max-time 30 'https://play-ai.cc/api/content-v2/status?date=2026-09-27&contentId=blog-ig%3A2026-09-27%3A1%3A68' -o sep27-content-status.json
          jq -r '.run.events[]? | [(.createdAt//""),(.stage//""),(.status//""),(.provider//""),(.model//""),((.httpStatus//"")|tostring),(.errorCode//""),(.errorMessage//""),((.details//null)|tojson)] | @tsv' sep27-content-status.json > sep27-events.txt
          cat sep27-events.txt || true
      - name: Commit status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sep27-status-now.json sep27-content-status.json sep27-events.txt
          git commit -m "ops: capture current Sep27 Cloudflare status" || true
          git push

