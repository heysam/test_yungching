name: Sep27 Cloudflare Status Once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-cloudflare-status-once.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current plan and image evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30             'https://play-ai.cc/api/content-v2/status?date=2026-09-27&contentId=blog-ig%3A2026-09-27%3A1%3A68'             -o /tmp/status.json
          echo '=== PLAN ==='
          jq '{
            instagram:{
              status:.instagram.status,
              renderedCount:.instagram.renderedCount,
              caption:.instagram.caption,
              hashtags:.instagram.hashtags,
              plannedSlides:.instagram.plannedSlides,
              slides:.instagram.slides
            }
          }' /tmp/status.json
          echo '=== IMAGE/PLAN EVENTS ==='
          jq -r '.run.events[]? 
            | select((.stage//"")|test("instagram-(plan|image|browser|render)"))
            | [(.createdAt//""),(.stage//""),(.status//""),(.provider//""),(.model//""),((.httpStatus//"")|tostring),(.errorCode//""),(.errorMessage//""),((.details//null)|tojson)] 
            | @tsv' /tmp/status.json

