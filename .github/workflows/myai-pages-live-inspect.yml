name: Myai Pages Live Inspect
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/myai-pages-live-inspect.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production Pages
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 45             -o /tmp/inspect.json -w '%{http_code}'             'https://play-ai.cc/api/cloudflare/self-inspect' || true)"
          echo "HTTP=$code"
          cat /tmp/inspect.json || true
