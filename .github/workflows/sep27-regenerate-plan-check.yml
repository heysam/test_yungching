name: Sep27 Regenerate Plan Check
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-regenerate-plan-check.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate plan only after Sep20 restore
        shell: bash
        run: |
          set -euo pipefail
          base="https://play-ai.cc/api/ops/sep27-ig-regenerate-9f27c4"
          key="sep27-9f27c4-regenerate-export"
          code="$(curl --silent --show-error --max-time 170             -o sep27-plan.json -w '%{http_code}'             "${base}?key=${key}&action=plan" || true)"
          echo "PLAN_HTTP=$code"
          cat sep27-plan.json || true
          sleep 5
          curl --fail-with-body --silent --show-error --max-time 30             "${base}?key=${key}&action=status" -o sep27-plan-status.json
          jq '{success,instagramStatus,renderedCount,caption,hashtags,cover:(.planSlides[0] // null),slideCount:(.planSlides|length)}' sep27-plan-status.json
          test "$(jq -r '(.planSlides|length) // 0' sep27-plan-status.json)" = "5"
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --soft origin/master
          git add sep27-plan.json sep27-plan-status.json 2>/dev/null || true
          git commit -m "ops: capture Sep27 plan after Sep20 restore" || true
          git push
