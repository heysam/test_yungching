name: Sep27 Regenerate Plan Check
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-regenerate-plan-check.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset and regenerate plan
        shell: bash
        run: |
          set -euo pipefail
          base="https://play-ai.cc/api/ops/sep27-ig-regenerate-9f27c4"
          key="sep27-9f27c4-regenerate-export"
          curl --fail-with-body --silent --show-error --max-time 60             "${base}?key=${key}&action=reset" -o sep27-reset.json
          cat sep27-reset.json
          curl --fail-with-body --silent --show-error --max-time 180             "${base}?key=${key}&action=plan" -o sep27-plan.json
          jq '{success,action,contentId,reused,model,cover:(.plan.slides[0]),caption:.plan.caption,hashtags:.plan.hashtags}' sep27-plan.json
      - name: Persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sep27-reset.json sep27-plan.json
          git commit -m "ops: capture Sep27 regenerated plan" || true
          git push
