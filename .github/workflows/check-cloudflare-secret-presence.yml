name: Check Cloudflare Secret Presence
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/check-cloudflare-secret-presence.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_ID: ${{ secrets.MYAI_CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.MYAI_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CF_ID:-}" ]; then echo "ACCOUNT_ID_PRESENT=true"; else echo "ACCOUNT_ID_PRESENT=false"; fi
          if [ -n "${CF_TOKEN:-}" ]; then echo "API_TOKEN_PRESENT=true"; else echo "API_TOKEN_PRESENT=false"; fi
