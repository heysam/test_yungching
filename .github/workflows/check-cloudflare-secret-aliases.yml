name: Check Cloudflare Secret Aliases
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/check-cloudflare-secret-aliases.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A2: ${{ secrets.CF_ACCOUNT_ID }}
      T2: ${{ secrets.CF_API_TOKEN }}
      A3: ${{ secrets.MYAI_CLOUDFLARE_ACCOUNT_ID }}
      T3: ${{ secrets.MYAI_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Presence only
        shell: bash
        run: |
          for n in A T A2 T2 A3 T3; do
            if [ -n "${!n:-}" ]; then echo "$n=true"; else echo "$n=false"; fi
          done
