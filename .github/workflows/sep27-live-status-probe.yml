name: Sep27 Live Status Probe
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-live-status-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read regeneration status
        shell: bash
        run: |
          set -euo pipefail
          base="https://play-ai.cc/api/ops/sep27-ig-regenerate-9f27c4"
          key="sep27-9f27c4-regenerate-export"
          curl --silent --show-error --max-time 30             "${base}?key=${key}&action=status" -o status.json
          jq '{success,contentId,instagramStatus,renderedCount,caption,hashtags,cover:(.planSlides[0] // null),slides}' status.json
