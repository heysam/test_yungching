name: Sep27 Stage Corrected Data URLs
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sep27-stage-dataurl-r2.yml"
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage fixed-length data URLs
        shell: bash
        run: |
          set -euo pipefail
          echo '[]' > sep27-r2-final-results.json
          for i in 1 2 3 4 5; do
            python3 - "$i" <<'PY'
          import sys,base64,json,pathlib
          i=sys.argv[1]
          p=pathlib.Path(f"sep27-rendered/slide-{i}.png")
          data="data:image/png;base64,"+base64.b64encode(p.read_bytes()).decode()
          pathlib.Path("/tmp/body.json").write_text(json.dumps({"sourceUrl":data,"mediaType":"image"}),encoding="utf-8")
          PY
            code="$(curl --silent --show-error --max-time 120               --output "/tmp/stage-${i}.json" --write-out '%{http_code}'               --request POST 'https://play-ai.cc/api/ig/stage-media'               --header 'Content-Type: application/json'               --header 'Origin: https://play-ai.cc'               --header 'Sec-Fetch-Site: same-origin'               --data-binary @/tmp/body.json || true)"
            echo "slide=$i stage_http=$code"
            cat "/tmp/stage-${i}.json"
            test "$code" = "200"
            jq -e '.success == true and .url' "/tmp/stage-${i}.json" >/dev/null
            python3 - "$i" "/tmp/stage-${i}.json" <<'PY'
          import sys,json,pathlib
          i=int(sys.argv[1]); resp=json.load(open(sys.argv[2]))
          p=pathlib.Path("sep27-r2-final-results.json")
          rows=json.loads(p.read_text())
          rows.append({"index":i,"url":resp["url"],"key":resp["key"]})
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n")
          PY
          done
          cat sep27-r2-final-results.json

      - name: Verify five public URLs
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq 'length' sep27-r2-final-results.json)" = "5"
          jq -r '.[].url' sep27-r2-final-results.json | while IFS= read -r u; do
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$u")"
            echo "$code $u"
            test "$code" = "200"
          done

      - name: Persist final links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --soft origin/master
          git add sep27-r2-final-results.json
          git commit -m "ops: capture final Sep27 corrected R2 URLs" || true
          git push
